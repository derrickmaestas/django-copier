# compose.override.yaml — development overrides (auto-loaded by `docker compose up`)
# Adds web + worker containers with file watching for hot-reload.
#
# Start with:  docker compose up --watch
# Or:          docker compose watch     (watch-only, no log streaming)

services:
  web:
    build:
      context: .
      args:
        UV_INSTALL_ARGS: "--all-groups"   # install all dependency groups (dev, test, prod)
    command: uv run manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    # Bind-mounts make host edits immediately visible inside the container
    # without needing `docker compose up --watch`. Django's runserver picks
    # up Python changes via its built-in autoreloader.
    volumes:
      - ./apps:/app/apps
      - ./config:/app/config
      - ./templates:/app/templates
      - ./static:/app/static
    develop:
      watch:
        # Sync Python source — Django's runserver auto-reloads on change
        - action: sync
          path: ./apps
          target: /app/apps

        - action: sync
          path: ./config
          target: /app/config

        - action: sync
          path: ./templates
          target: /app/templates

        - action: sync
          path: ./static
          target: /app/static

        # Restart on config file changes (not picked up by auto-reload)
        - action: sync+restart
          path: ./.env
          target: /app/.env

        # Rebuild image when dependencies change
        - action: rebuild
          path: ./pyproject.toml

        - action: rebuild
          path: ./uv.lock

  worker:
    build:
      context: .
      args:
        UV_INSTALL_ARGS: "--all-groups"
    command: uv run manage.py db_worker
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./apps
          target: /app/apps

        - action: sync
          path: ./config
          target: /app/config

        - action: sync+restart
          path: ./.env
          target: /app/.env

        - action: rebuild
          path: ./pyproject.toml

        - action: rebuild
          path: ./uv.lock

  # Tailwind watcher — rebuilds /app/static/css/tailwind.css whenever any
  # template or apps/*/templates file changes. Bind-mounts source dirs so
  # the watcher sees host edits without a sync round-trip, and writes the
  # output back to the host so the web container's watch sync picks it up.
  tailwind:
    build:
      context: .
      args:
        UV_INSTALL_ARGS: "--all-groups"
    user: root
    command: uv run manage.py tailwind watch
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps:/app/apps
      - ./config:/app/config
      - ./templates:/app/templates
      - ./static:/app/static
