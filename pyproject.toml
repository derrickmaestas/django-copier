[project]
name = "planly-django"
version = "0.1.0"
description = "A Django task management app modeled after Microsoft Planner"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0",
    "psycopg[binary]",
    "django-extensions",
    "django-storages[s3]>=1.14.6",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "django-debug-toolbar",
    "ruff",
    "ty",
]
test = [
    "pytest",
    "pytest-django",
    "factory-boy",
    "coverage",
]
prod = [
    "gunicorn",
    "whitenoise",
    "sentry-sdk",
    "structlog",
]

[tool.ruff]
target-version = "py314"
line-length = 99
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "DJ",    # flake8-django
    "S",     # flake8-bandit (security)
]
ignore = [
    "S101",  # allow assert in tests
]

[tool.ruff.lint.isort]
known-first-party = ["apps"]

[tool.ty]
python-version = "3.14"

[tool.ty.rules]
possibly-unbound-attribute = "warn"
invalid-assignment = "error"
unresolved-attribute = "error"

[tool.pytest.ini_options]
# Use --ds (not DJANGO_SETTINGS_MODULE here) so pytest's choice of test
# settings beats any DJANGO_SETTINGS_MODULE env var inherited from the
# container — pytest-django's --ds flag takes precedence over the env var.
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--ds=config.settings.test --reuse-db --no-migrations -q --import-mode=importlib"

[tool.coverage.run]
source = ["apps/"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
