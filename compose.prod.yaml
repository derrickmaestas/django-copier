# compose.prod.yaml — production overrides
# Usage: docker compose -f compose.yaml -f compose.prod.yaml up

services:
  web:
    build: .
    # Uses the Dockerfile CMD (gunicorn) — no command override
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DJANGO_ENV: production
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: python manage.py db_worker
    env_file: .env
    environment:
      DJANGO_ENV: production
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
