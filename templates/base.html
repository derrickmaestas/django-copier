{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Planly{% endblock %}</title>
</head>
<body>
  <nav>
    <a href="{% url 'home' %}">Planly</a>
    {% if user.is_authenticated %}
      <a href="{% url 'plans:plan-list' %}">Plans</a>
      <a href="{% url 'notifications:notification-list' %}">Notifications</a>
      <span>{{ user }}</span>
      <form action="{% url 'logout' %}" method="post" style="display:inline">
        {% csrf_token %}
        <button type="submit">Log out</button>
      </form>
    {% else %}
      <a href="{% url 'login' %}">Log in</a>
    {% endif %}
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
