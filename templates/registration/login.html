{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Log in — Planly{% endblock %}

{% block content %}
<div class="mx-auto max-w-md">
  <h1 class="text-2xl font-semibold text-slate-900 mb-6">Log in</h1>

  <form method="post" class="space-y-4 bg-white p-6 rounded-lg shadow-sm border border-slate-200">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit"
            class="w-full rounded-md bg-indigo-600 px-3 py-2 text-sm font-medium text-white hover:bg-indigo-700">
      Log in
    </button>
  </form>
</div>
{% endblock %}
